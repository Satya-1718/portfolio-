<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="store.css">
<script src="store.js"></script></head>
<body>
<h2>Shopping Cart</h2>
<div class="cart-wrap"><table>
  <thead><tr><th>Book</th><th>Price</th><th>Quantity</th><th>Total</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
  <tfoot><tr><th colspan="3">Grand total</th><th id="total" colspan="2"></th></tr></tfoot>
</table></div>
<p id="empty"></p>
<button type="button" id="clear">Clear cart</button>
<script>
function render() {
  var rows = document.getElementById('rows'), total = 0, cart = getCart();
  rows.textContent = '';
  cart.forEach(function (item) {
    var b = bookById(item.id), line = b.price * item.qty;
    total += line;
    var minus = el('button', { type: 'button', 'aria-label': 'Decrease quantity', text: '\u2212' });
    var plus = el('button', { type: 'button', 'aria-label': 'Increase quantity', text: '+' });
    var del = el('button', { type: 'button', text: 'Remove' });
    minus.addEventListener('click', function () { setQty(item.id, item.qty - 1); render(); });
    plus.addEventListener('click', function () { setQty(item.id, item.qty + 1); render(); });
    del.addEventListener('click', function () { setQty(item.id, 0); render(); toast('Removed from cart'); });
    var tr = el('tr', {}, [
      el('td', { text: b.title }),
      el('td', { text: '\u20B9' + b.price }),
      el('td', {}, [el('span', { 'class': 'qty' }, [minus, el('span', { text: String(item.qty) }), plus])]),
      el('td', { text: '\u20B9' + line }),
      el('td', {}, [del])
    ]);
    rows.appendChild(tr);
  });
  document.getElementById('total').textContent = '\u20B9' + total;
  var empty = document.getElementById('empty');
  empty.textContent = '';
  if (!cart.length) {
    empty.appendChild(document.createTextNode('Your cart is empty. '));
    empty.appendChild(el('a', { href: 'catalogue.html', text: 'Browse the catalogue' }));
  }
}
document.getElementById('clear').addEventListener('click', function () { saveCart([]); render(); });
render();
</script>
</body></html>
